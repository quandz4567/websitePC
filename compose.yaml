services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcstore
      POSTGRES_USER: pcstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pcstore_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcstore -d pcstore"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://pcstore:${POSTGRES_PASSWORD:-pcstore_local}@db:5432/pcstore
      PORT: "3001"
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  pgdata:
